window.addEventListener('DOMContentLoaded',async()=>{const p=new URLSearchParams(location.search),slug=p.get('slug')||location.hash.replace('#/','').replace('#','');const t=localStorage.getItem('hub_theme');if(t)document.documentElement.setAttribute('data-theme',t);if(slug){authOverlay.style.display='none';backToDashBtn.style.display='none';await loadPublicProfileBySlug(slug.toLowerCase())}});async function loadPublicProfileBySlug(slug){try{const q=query(collection(db,'users'),where('slug','==',slug)),s=await getDocs(q);if(!s.empty){window.appData={...window.appData,...s.docs[0].data()};renderPublicPage()}else authOverlay.innerHTML=`<div class="auth-card"><h2>Profile Not Found</h2><p>No user profile matches slug: /@${sanitizeHTML(slug)}</p><button class="action-btn" onclick="window.location.href=window.location.pathname">Go to Login</button></div>`}catch(e){console.error(e)}}

window.saveProfileData=async()=>{const s=inputSlug.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g,'');if(!s)return alert('Please enter a valid URL slug.');Object.assign(appData,{slug:s,avatar:inputAvatar.value,name:inputName.value,shortBio:inputShortBio.value,email:inputEmail.value,website:inputWebsite.value,telephone:inputPhone.value,longInfo:inputLongInfo.value,address:inputAddress.value});slugDisplay.innerText=`Slug: /@${s}`;renderAdminLists();await saveUserDataToFirestore()};window.viewPublicPage=()=>{dashboardContent.style.display='none';renderPublicPage()};window.backToDashboard=()=>{publicProfileView.style.display='none';dashboardContent.style.display='flex'};window.switchDashboardTab=i=>{document.querySelectorAll('#dashboardContent .tab-btn').forEach((b,x)=>b.classList.toggle('active',x===i));document.querySelectorAll('#dashboardContent .tab-panel').forEach((p,x)=>p.classList.toggle('active',x===i))};window.switchPublicTab=i=>{document.querySelectorAll('#publicProfileView .tab-btn').forEach((b,x)=>b.classList.toggle('active',x===i));document.querySelectorAll('#publicProfileView .tab-panel').forEach((p,x)=>p.classList.toggle('active',x===i))};
function sanitizeHTML(s){if(!s)return'';return String(s).replace(/[&<>'"]/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]))}function sanitizeURL(u){if(!u)return'#';u=u.trim();return/^(https?:\/\/|mailto:|tel:|data:image\/)/i.test(u)?u:'#'}function parseYouTubeID(u){if(!u)return null;u=String(u).trim();if(/^[\w-]{11}$/.test(u))return u;const m=u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/|live\/)([^#&?]*).*/);return m&&m[2].length===11?m[2]:null}function videoSeed(v,i){let s=(v.id||'')+(v.title||'')+i,h=0;for(let x=0;x<s.length;x++)h=(h*31+s.charCodeAt(x))>>>0;return(h%10000)/10000}function activatePublicVideo(card,id){const f=card.querySelector('.tv-frame');if(f.querySelector('iframe'))return;f.innerHTML=`<iframe src="https://www.youtube.com/embed/${sanitizeHTML(id)}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`}
function renderPublicPage(){publicProfileView.style.display='flex';publicSlugHeader.innerText=`Public Profile: /@${appData.slug} (Share Link: ${location.origin}${location.pathname}?slug=${appData.slug})`;pubAvatarContainer.innerHTML='';if(appData.avatar){const i=document.createElement('img');i.className='avatar-preview';i.src=sanitizeURL(appData.avatar);pubAvatarContainer.appendChild(i)}else{const d=document.createElement('div');d.className='avatar-preview';d.innerText=appData.name?appData.name.charAt(0):'U';pubAvatarContainer.appendChild(d)}pubName.innerText=appData.name||'';pubShortBio.innerText=appData.shortBio||'';pubLongInfo.innerText=appData.longInfo||'';let c='';if(appData.email)c+=`<div>📧 <b>Email:</b> <a href="mailto:${sanitizeHTML(appData.email)}" style="color:var(--text-color)">${sanitizeHTML(appData.email)}</a></div>`;if(appData.telephone)c+=`<div>📞 <b>Phone:</b> <a href="tel:${sanitizeHTML(appData.telephone)}" style="color:var(--text-color)">${sanitizeHTML(appData.telephone)}</a></div>`;if(appData.website)c+=`<div>🌐 <b>Website:</b> <a href="${sanitizeURL(appData.website)}" target="_blank" style="color:var(--text-color)">${sanitizeHTML(appData.website)}</a></div>`;if(appData.address)c+=`<div>📍 <b>Address:</b> ${sanitizeHTML(appData.address)}</div>`;pubContact.innerHTML=c;pubLinks.innerHTML='';(appData.extraFields||[]).forEach(x=>{const a=document.createElement('a');a.className='bio-btn';a.href=sanitizeURL(x.url);a.target='_blank';a.rel='noopener noreferrer';a.innerHTML=sanitizeHTML(x.label||'Link');pubLinks.appendChild(a)});resetAndRenderPublicTimeline();pubWall.innerHTML='';(appData.videos||[]).forEach((v,i)=>{const id=parseYouTubeID(v.id)||v.id,seed=videoSeed(v,i),card=document.createElement('article');card.className='tv-box';const color=v.wallColor||videoColors[Math.floor(seed*videoColors.length)%videoColors.length],rot=-2+((seed*9973)%1)*4,scale=.96+((seed*619)%1)*.07,y=-6+((seed*431)%1)*14;card.style.setProperty('--video-card',color);card.style.transform=`rotate(${rot}deg) translateY(${y}px) scale(${scale})`;card.innerHTML=`<div class="tv-frame"><img class="tv-thumb" src="https://i.ytimg.com/vi/${sanitizeHTML(id)}/hqdefault.jpg" alt="" loading="lazy"><div class="tv-play" aria-label="Play video"></div></div><div class="tv-title">${sanitizeHTML(v.title||'Video')}</div>`;card.querySelector('.tv-play').onclick=()=>activatePublicVideo(card,id);pubWall.appendChild(card)})}
window.resetAndRenderPublicTimeline=()=>{const o=publicSortOrderSelect.value;cachedSortedStories=[...(appData.stories||[])].sort((a,b)=>o==='new'?new Date(b.datetime)-new Date(a.datetime):new Date(a.datetime)-new Date(b.datetime));publicLoadedCount=0;pubThermometerTimeline.innerHTML='';renderNextPublicTimelineBatch()};window.renderNextPublicTimelineBatch=renderNextPublicTimelineBatch;function renderNextPublicTimelineBatch(){const t=pubThermometerTimeline,old=t.querySelector('.thermometer-base-bulb');if(old)old.remove();const n=Math.min(publicLoadedCount+CHUNK_SIZE,cachedSortedStories.length);for(let i=publicLoadedCount;i<n;i++){const s=cachedSortedStories[i],d=document.createElement('div');d.className=`timeline-item ${i%2?'right':'left'}`;let m='';if(s.url){const id=parseYouTubeID(s.url);m=id?`<div class="media-player-container"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`:`<a href="${sanitizeURL(s.url)}" target="_blank" style="display:inline-block;margin-top:8px;color:var(--accent-color);font-size:.85rem;font-weight:bold">🔗 Open Link</a>`}d.innerHTML=`<div class="timeline-content"><span class="date-badge">${sanitizeHTML(s.datetime)}</span><h3 style="font-size:1rem;margin-bottom:4px">${sanitizeHTML(s.title)}</h3><p style="font-size:.85rem;opacity:.9;line-height:1.4">${sanitizeHTML(s.desc)}</p>${m}</div>`;t.appendChild(d)}publicLoadedCount=n;if(cachedSortedStories.length){const b=document.createElement('div');b.className='thermometer-base-bulb';t.appendChild(b)}timelineLoadingMsg.innerText=publicLoadedCount>=cachedSortedStories.length?'All statuses loaded.':'Scroll down to load more statuses...'}window.handlePublicTimelineScroll=()=>{if(timelineScrollBox.scrollTop+timelineScrollBox.clientHeight>=timelineScrollBox.scrollHeight-100&&publicLoadedCount<cachedSortedStories.length)renderNextPublicTimelineBatch()};window.toggleTheme=()=>{const h=document.documentElement,current=h.getAttribute('data-theme'),themes=['very-black','white','chameleon'],n=themes[(themes.indexOf(current)+1)%themes.length];h.setAttribute('data-theme',n);localStorage.setItem('hub_theme',n)};
function initDashboard(){const t=localStorage.getItem('hub_theme');if(t)document.documentElement.setAttribute('data-theme',t);inputSlug.value=appData.slug;slugDisplay.innerText=`Slug: /@${appData.slug}`;roleIndicator.innerText=`Role: ${appData.role.toUpperCase()}`;inputAvatar.value=appData.avatar;inputName.value=appData.name;inputShortBio.value=appData.shortBio;inputEmail.value=appData.email;inputWebsite.value=appData.website;inputPhone.value=appData.telephone;inputLongInfo.value=appData.longInfo;inputAddress.value=appData.address;renderDynamicFieldsInputs();renderAdminLists()}function renderDynamicFieldsInputs(){dynamicFieldsContainer.innerHTML='';appData.extraFields.forEach((f,i)=>{const r=document.createElement('div');r.style.cssText='display:flex;gap:8px;margin-bottom:8px';r.innerHTML=`<input placeholder="Label (e.g. YouTube 1)" value="${sanitizeHTML(f.label)}" oninput="updateFieldData(${i},'label',this.value)" style="flex:1"><input placeholder="URL Link" value="${sanitizeHTML(f.url)}" oninput="updateFieldData(${i},'url',this.value)" style="flex:1.5"><button class="delete-btn" onclick="removeExtraFieldRow(${i})">X</button>`;dynamicFieldsContainer.appendChild(r)});fieldCountTracker.innerText=appData.extraFields.length}window.addExtraFieldRow=(label,url)=>{appData.extraFields.push({label,url});renderDynamicFieldsInputs()};window.removeExtraFieldRow=i=>{appData.extraFields.splice(i,1);renderDynamicFieldsInputs()};window.updateFieldData=(i,k,v)=>appData.extraFields[i][k]=v;
window.saveTimelineMilestone=async()=>{const title=timelineTitle.value,datetime=timelineDate.value||new Date().toISOString().slice(0,16),desc=timelineDesc.value,url=timelineUrl.value,i=parseInt(editingTimelineIndex.value);if(!title)return alert('Please enter a status title.');if(i>-1){appData.stories[i]={title,datetime,desc,url};cancelEditTimeline()}else{appData.stories.push({title,datetime,desc,url});timelineTitle.value=timelineDesc.value=timelineUrl.value=''}renderAdminLists();await saveUserDataToFirestore()};window.editTimelineMilestone=i=>{const s=appData.stories[i];timelineTitle.value=s.title;timelineDate.value=s.datetime;timelineDesc.value=s.desc;timelineUrl.value=s.url;editingTimelineIndex.value=i;timelineFormHeader.innerText='Edit ThermoTimelineMeter Status';timelineSubmitBtn.innerText='Update Status';timelineCancelBtn.style.display='block'};window.cancelEditTimeline=()=>{timelineTitle.value=timelineDate.value=timelineDesc.value=timelineUrl.value='';editingTimelineIndex.value='-1';timelineFormHeader.innerText='Add ThermoTimelineMeter Status';timelineSubmitBtn.innerText='Post Status';timelineCancelBtn.style.display='none'};window.removeTimelineMilestone=async i=>{appData.stories.splice(i,1);cancelEditTimeline();renderAdminLists();await saveUserDataToFirestore()};window.addVideoBoxItem=async()=>{const title=videoTitleInput.value,raw=videoUrlInput.value;if(!title||!raw)return alert('Please enter a title and YouTube link/ID.');const id=parseYouTubeID(raw)||raw,wallColor=videoColors[Math.floor(Math.random()*videoColors.length)];appData.videos.push({title,id,wallColor});videoTitleInput.value=videoUrlInput.value='';renderAdminLists();await saveUserDataToFirestore()};window.removeVideoBoxItem=async i=>{appData.videos.splice(i,1);renderAdminLists();await saveUserDataToFirestore()};function renderAdminLists(){timelineManagerList.innerHTML='';appData.stories.forEach((s,i)=>{const r=document.createElement('div');r.className='item-row';r.innerHTML=`<div><b>${sanitizeHTML(s.title)}</b> <span style="font-size:.75rem;opacity:.6">(${s.datetime})</span></div><div><button class="edit-btn" onclick="editTimelineMilestone(${i})">Edit</button><button class="delete-btn" onclick="removeTimelineMilestone(${i})">Delete</button></div>`;timelineManagerList.appendChild(r)});videoManagerList.innerHTML='';appData.videos.forEach((v,i)=>{const r=document.createElement('div');r.className='item-row';r.innerHTML=`<div><b>${sanitizeHTML(v.title)}</b></div><button class="delete-btn" onclick="removeVideoBoxItem(${i})">Remove</button>`;videoManagerList.appendChild(r)})}
</script></body></html>
